name: AI Worker contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/ai-worker-foundation-clean]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  worker-contract:
    name: Validate AI Worker definition contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check worker contract
        run: deno check supabase/functions/_shared/workerContract.ts supabase/functions/_shared/workerContract.test.ts
      - name: Test worker contract and safety invariants
        run: deno test supabase/functions/_shared/workerContract.test.ts
