name: Director client table privilege regression

on:
  pull_request:
    paths:
      - "supabase/migrations/*restrict_director_client_table_ddl_privileges.sql"
      - "supabase/tests/director_client_table_privileges.sql"
      - ".github/workflows/director-client-table-privileges.yml"
  push:
    branches: [fix/director-client-table-privileges]
    paths:
      - "supabase/migrations/*restrict_director_client_table_ddl_privileges.sql"
      - "supabase/tests/director_client_table_privileges.sql"
      - ".github/workflows/director-client-table-privileges.yml"

permissions:
  contents: read

jobs:
  director-client-table-privileges:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rutex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rutex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: rutex_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create representative Director tables with broad legacy grants
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;

          CREATE TABLE public.director_commands (id uuid PRIMARY KEY, user_id uuid NOT NULL, status text NOT NULL);
          CREATE TABLE public.director_messages (id uuid PRIMARY KEY, thread_id uuid NOT NULL, content text NOT NULL);
          CREATE TABLE public.director_threads (id uuid PRIMARY KEY, user_id uuid NOT NULL, title text NOT NULL);

          ALTER TABLE public.director_commands ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.director_messages ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.director_threads ENABLE ROW LEVEL SECURITY;

          GRANT ALL ON TABLE public.director_commands, public.director_messages, public.director_threads
            TO PUBLIC, anon, authenticated, service_role;
          SQL
      - name: Apply least-privilege migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020000001_restrict_director_client_table_ddl_privileges.sql
      - name: Assert intended row access and no client DDL privileges
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/director_client_table_privileges.sql
