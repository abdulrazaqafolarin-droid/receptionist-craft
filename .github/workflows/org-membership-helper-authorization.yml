name: Organization membership helper authorization

on:
  pull_request:
    paths:
      - "supabase/migrations/*secure_org_membership_helpers.sql"
      - "supabase/tests/org_membership_helper_authorization.sql"
      - ".github/workflows/org-membership-helper-authorization.yml"
  push:
    branches: [fix/org-membership-helper-authorization]
    paths:
      - "supabase/migrations/*secure_org_membership_helpers.sql"
      - "supabase/tests/org_membership_helper_authorization.sql"
      - ".github/workflows/org-membership-helper-authorization.yml"

permissions:
  contents: read

jobs:
  org-membership-helper-authorization:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rutex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rutex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: rutex_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Bootstrap organization schema and auth identity helper
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          CREATE TYPE public.app_role AS ENUM ('owner', 'admin', 'member', 'viewer');
          CREATE TABLE public.organization_members (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            organization_id uuid NOT NULL,
            user_id uuid NOT NULL,
            role public.app_role NOT NULL DEFAULT 'member',
            joined_at timestamptz
          );
          CREATE FUNCTION public.get_user_org_ids(uuid) RETURNS SETOF uuid LANGUAGE sql STABLE SECURITY DEFINER AS $$ SELECT NULL::uuid WHERE false $$;
          CREATE FUNCTION public.has_org_role(uuid, uuid, public.app_role) RETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER AS $$ SELECT false $$;
          CREATE FUNCTION public.is_org_member(uuid, uuid) RETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER AS $$ SELECT false $$;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO PUBLIC, anon, authenticated, service_role;
          SQL
      - name: Apply membership helper authorization migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020000003_secure_org_membership_helpers.sql
      - name: Verify caller identity, joined status, and grants
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/org_membership_helper_authorization.sql
