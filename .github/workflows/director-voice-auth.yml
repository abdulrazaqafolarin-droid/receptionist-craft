name: Director voice authorization

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/directorVoiceAuth.ts"
      - "supabase/functions/_shared/directorVoiceAuth.test.ts"
      - "supabase/functions/director-voice/index.ts"
      - ".github/workflows/director-voice-auth.yml"
  push:
    branches: [main, fix/director-voice-auth]
    paths:
      - "supabase/functions/_shared/directorVoiceAuth.ts"
      - "supabase/functions/_shared/directorVoiceAuth.test.ts"
      - "supabase/functions/director-voice/index.ts"
      - ".github/workflows/director-voice-auth.yml"

permissions:
  contents: read

jobs:
  director-voice-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check voice authorization helper and tests
        run: deno check supabase/functions/_shared/directorVoiceAuth.ts supabase/functions/_shared/directorVoiceAuth.test.ts
      - name: Run authorization regression tests
        run: deno test supabase/functions/_shared/directorVoiceAuth.test.ts
      - name: Type-check Director voice endpoint
        run: deno check supabase/functions/director-voice/index.ts
