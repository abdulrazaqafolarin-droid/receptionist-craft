name: Appointment action authorization

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/appointmentActionAuth.ts"
      - "supabase/functions/_shared/appointmentActionAuth.test.ts"
      - "supabase/functions/appointment-action/index.ts"
      - ".github/workflows/appointment-action-auth.yml"
  push:
    branches: [main, fix/appointment-action-authz]
    paths:
      - "supabase/functions/_shared/appointmentActionAuth.ts"
      - "supabase/functions/_shared/appointmentActionAuth.test.ts"
      - "supabase/functions/appointment-action/index.ts"
      - ".github/workflows/appointment-action-auth.yml"

permissions:
  contents: read

jobs:
  appointment-action-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check authorization helper and tests
        run: deno check supabase/functions/_shared/appointmentActionAuth.ts supabase/functions/_shared/appointmentActionAuth.test.ts
      - name: Run authorization regression tests
        run: deno test supabase/functions/_shared/appointmentActionAuth.test.ts
      - name: Type-check appointment action endpoint
        run: deno check supabase/functions/appointment-action/index.ts
