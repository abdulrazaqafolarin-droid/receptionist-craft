name: Notification ownership authorization

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/notificationAuth.ts"
      - "supabase/functions/_shared/notificationAuth.test.ts"
      - "supabase/functions/create-notification/index.ts"
      - ".github/workflows/notification-owner-auth.yml"
  push:
    branches: [main, fix/notification-owner-authz]
    paths:
      - "supabase/functions/_shared/notificationAuth.ts"
      - "supabase/functions/_shared/notificationAuth.test.ts"
      - "supabase/functions/create-notification/index.ts"
      - ".github/workflows/notification-owner-auth.yml"

permissions:
  contents: read

jobs:
  notification-owner-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check authorization helper and tests
        run: deno check supabase/functions/_shared/notificationAuth.ts supabase/functions/_shared/notificationAuth.test.ts
      - name: Run authorization regression tests
        run: deno test supabase/functions/_shared/notificationAuth.test.ts
      - name: Type-check notification endpoint
        run: deno check supabase/functions/create-notification/index.ts
