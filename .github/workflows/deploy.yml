# Rutex CI + edge-function deploy.
#
# Why this exists: the Supabase CLI (Bun) crashes on CPUs without AVX, so
# deployments cannot run on some local machines. GitHub-hosted x64 runners
# always have AVX, so every push to main typechecks, verifies the surface
# manifest, and deploys all edge functions from a healthy environment.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  — a fresh `sbp_...` token (rotate the exposed ones first)
#   SUPABASE_PROJECT_REF   — esvrhnlwquunsdduvbnr
#
# Frontend (Vercel) deploys itself on push — this workflow only handles
# Supabase edge functions.

name: typecheck-and-deploy-functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (ratchet — fails only on NEW errors)
        run: |
          npm run typecheck > /tmp/tsc.log 2>&1 || true
          node scripts/check-tsc-ratchet.mjs /tmp/tsc.log

      - name: Verify surface manifest has not drifted
        run: npm run verify:manifest

      - name: Verify actor map has not drifted
        run: npm run verify:actor-map

      - name: Derivation matrix test (model never guesses pages)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run derivation matrix test
        run: deno test supabase/functions/_shared/config/surfaceDerivation.test.ts

      - name: Run interview golden test (problem-type routing)
        run: deno test --no-check --unstable-sloppy-imports src/lib/conversationalInterview.test.ts

      - name: Run console prompt test (staff bounds + snapshot contract)
        run: deno test supabase/functions/_shared/config/consolePrompt.test.ts

      - name: Run stock write-validation test (shelf truth gate)
        run: deno test supabase/functions/_shared/modules/stockTracker.test.ts

      - name: Run snake engine test (planning-game rules)
        run: deno test --no-check --unstable-sloppy-imports src/lib/snakeEngine.test.ts

      - name: Run actor engine test (map + guardrails + runner)
        run: deno test --no-check --unstable-sloppy-imports src/lib/actorEngine.test.ts

      - name: Run director briefing test (brief lines + grant gate)
        run: deno test --no-check --unstable-sloppy-imports src/lib/directorBrief.test.ts

      - name: Run director mood test (engagement outranks idle)
        run: deno test --no-check --unstable-sloppy-imports src/lib/directorMood.test.ts

      - name: Run actor plan validation test (planner tours)
        run: deno test supabase/functions/_shared/config/actorPlan.test.ts

      - name: Run capability resolution test (interface priority + verification)
        run: deno test supabase/functions/_shared/config/capabilityRegistry.test.ts

      - name: Actor tours export is fresh (Jev reads this file)
        run: |
          deno run --allow-read --allow-write scripts/export-actor-tours.ts
          git diff --exit-code scripts/actor-tours.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        run: |
          supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
