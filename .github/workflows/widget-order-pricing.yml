name: Widget order pricing integrity

on:
  pull_request:
    paths:
      - "supabase/migrations/*secure_widget_order_pricing.sql"
      - "supabase/tests/secure_widget_order_pricing.sql"
      - ".github/workflows/widget-order-pricing.yml"
  push:
    branches: [main, fix/widget-order-pricing]
    paths:
      - "supabase/migrations/*secure_widget_order_pricing.sql"
      - "supabase/tests/secure_widget_order_pricing.sql"
      - ".github/workflows/widget-order-pricing.yml"

permissions:
  contents: read

jobs:
  widget-order-pricing:
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: rutex_test
    steps:
      - uses: actions/checkout@v4
      - name: Install and start PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql postgresql-client
          sudo service postgresql start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb rutex_test
      - name: Create minimal representative schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE TABLE public.receptionists (
            id uuid PRIMARY KEY, active boolean NOT NULL DEFAULT true
          );
          CREATE TABLE public.services (
            id uuid PRIMARY KEY, receptionist_id uuid NOT NULL REFERENCES public.receptionists(id),
            name text NOT NULL, price numeric, active boolean DEFAULT true, is_product boolean DEFAULT false
          );
          CREATE TABLE public.orders (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            receptionist_id uuid NOT NULL REFERENCES public.receptionists(id),
            customer_name text NOT NULL, customer_email text, customer_phone text, notes text,
            total_amount numeric, metadata jsonb DEFAULT '{}'::jsonb,
            status text NOT NULL DEFAULT 'pending', idempotency_key text UNIQUE
          );
          CREATE TABLE public.order_items (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            order_id uuid NOT NULL REFERENCES public.orders(id) ON DELETE CASCADE,
            product_id uuid REFERENCES public.services(id) ON DELETE SET NULL,
            product_name text NOT NULL, quantity integer NOT NULL DEFAULT 1, unit_price numeric
          );
          SQL
      - name: Apply widget order pricing migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017000002_secure_widget_order_pricing.sql
      - name: Run widget order pricing and idempotency regression tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/secure_widget_order_pricing.sql
