name: Security definer RPC access regression

on:
  pull_request:
    paths:
      - "supabase/migrations/*secure_definer_rpc_access.sql"
      - "supabase/tests/secure_definer_rpc_access.sql"
      - ".github/workflows/secure-definer-rpc-access.yml"
  push:
    branches: [main, fix/security-definer-rpc-access]
    paths:
      - "supabase/migrations/*secure_definer_rpc_access.sql"
      - "supabase/tests/secure_definer_rpc_access.sql"
      - ".github/workflows/secure-definer-rpc-access.yml"

permissions:
  contents: read

jobs:
  security-definer-rpc-access:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rutex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rutex_test"
          --health-interval 5s
          --health-timeout 5s
          --retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: rutex_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Create minimal representative schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS
            $$ SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          CREATE TYPE public.receptionist_tone AS ENUM ('friendly', 'professional', 'casual', 'formal');
          CREATE TABLE public.receptionists (
            id uuid PRIMARY KEY, user_id uuid NOT NULL, name text, business_name text,
            business_type text, greeting_message text, tone public.receptionist_tone,
            language text, currency text, business_phone text, address text, website text,
            business_info jsonb, capabilities jsonb, knowledge_base text, business_model text
          );
          CREATE TABLE public.config_versions (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(), receptionist_id uuid NOT NULL,
            version_number integer NOT NULL, config_json jsonb NOT NULL, plan_text text,
            change_source text, owner_input text, approved_by uuid, approved_at timestamptz,
            created_at timestamptz DEFAULT now()
          );
          CREATE TABLE public.services (id uuid PRIMARY KEY, stock_quantity integer);
          CREATE TABLE public.ai_booking_suggestions (created_at timestamptz);
          CREATE TABLE public.chat_messages (created_at timestamptz);
          CREATE TABLE public.conversation_state (last_message_at timestamptz);
          CREATE TABLE public.conversations (created_at timestamptz);
          CREATE FUNCTION public.cleanup_old_booking_suggestions(integer) RETURNS integer LANGUAGE sql AS $$ SELECT 0 $$;
          CREATE FUNCTION public.cleanup_old_chat_messages(integer) RETURNS integer LANGUAGE sql AS $$ SELECT 0 $$;
          CREATE FUNCTION public.cleanup_old_conversation_state(integer) RETURNS integer LANGUAGE sql AS $$ SELECT 0 $$;
          CREATE FUNCTION public.cleanup_old_conversations(integer) RETURNS integer LANGUAGE sql AS $$ SELECT 0 $$;
          CREATE FUNCTION public.deduct_stock(p_product_id uuid, p_quantity integer) RETURNS jsonb LANGUAGE sql AS $ SELECT '{}'::jsonb $;
          CREATE FUNCTION public.revert_config_version(p_receptionist_id uuid, p_target_version integer) RETURNS jsonb LANGUAGE sql AS $ SELECT '{}'::jsonb $;
          CREATE FUNCTION public.record_manual_version(uuid, text) RETURNS jsonb LANGUAGE sql AS $$ SELECT '{}'::jsonb $$;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO PUBLIC;
          GRANT ALL ON ALL TABLES IN SCHEMA public TO anon, authenticated, service_role;
          SQL
      - name: Apply security migration to disposable database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261016000002_secure_definer_rpc_access.sql
      - name: Assert least privilege, positive inventory quantities, and owner-scoped revert
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/secure_definer_rpc_access.sql
