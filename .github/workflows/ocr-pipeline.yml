name: OCR Pipeline for JAMB Questions

on:
  workflow_dispatch:
    inputs:
      pdf_subject:
        description: 'Subject to process (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - biology
          - physics
          - chemistry
          - mathematics
          - english
      reprocess:
        description: 'Reprocess already processed PDFs'
        type: boolean
        default: false
      use_cloud_ocr:
        description: 'Use OCR.space cloud API (fallback)'
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}

jobs:
  ocr:
    name: Extract Questions via OCR
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-glx \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev \
            libgomp1 \
            poppler-utils \
            tesseract-ocr \
            libtesseract-dev
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pdf2image pymupdf supabase requests
      
      - name: Download PDFs from Supabase Storage
        if: ${{ env.SUPABASE_URL != '' }}
        run: |
          python scripts/download_pdfs.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      
      - name: Run OCR Pipeline (PaddleX)
        if: ${{ !inputs.use_cloud_ocr }}
        run: |
          pip install paddlepaddle==2.6.1 -f https://www.paddlepaddle.org.cn/whl/linux/mkl/avx/stable.html
          pip install paddlex[ocr-core]==3.7.2
          python scripts/ocr_pipeline.py \
            --subject "${{ github.event.inputs.pdf_subject }}" \
            --reprocess "${{ github.event.inputs.reprocess }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      
      - name: Run Cloud OCR Pipeline (OCR.space)
        if: ${{ inputs.use_cloud_ocr }}
        run: |
          python scripts/ocr_cloud.py \
            --subject "${{ github.event.inputs.pdf_subject }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
      
      - name: Upload OCR Results as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-results-${{ github.run_id }}
          path: |
            ocr_output/
            ocr_output/**/*
          retention-days: 7
      
      - name: Commit Extracted Questions
        if: github.ref == 'refs/heads/main' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ocr_output/questions/
          git diff --staged --quiet || git commit -m "OCR: Add extracted questions [skip ci]"
          git push

  notify:
    name: Notify Completion
    needs: ocr
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send completion notification
        run: |
          echo "OCR Pipeline completed with status: ${{ needs.ocr.result }}"
          echo "Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"